name: Tests

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/**'
      - '**.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
  schedule:
    - cron: '0 0 * * *'

jobs:
  phpunit:
    runs-on: ${{ matrix.os }}

    env:
      SANDBOX_CONCURRENCY_REPETITIONS: ${{ matrix.os == 'windows-latest' && matrix.laravel == '12.*' && ((matrix.php == 8.3 && matrix.dependency-version == 'prefer-stable') || (matrix.php == 8.4 && matrix.dependency-version == 'prefer-lowest')) && '100' || '1' }}

    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4, 8.3, 8.2]
        os: [ubuntu-latest, windows-latest]
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - ${{ matrix.os }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6

      - name: Cache dependencies 🔧
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies 🔧
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests (Unit and Feature tests) via PHPUnit 🧪
        run: vendor/bin/phpunit --no-coverage --disable-coverage-ignore --order-by=random --random-order-seed=1788957854 --display-warnings --fail-on-warning --log-junit build/phpunit.xml

      - name: Preserve test evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.php }}-${{ matrix.os }}-laravel${{ startsWith(matrix.laravel, '12') && '12' || '13' }}-${{ matrix.dependency-version }}
          path: build/phpunit.xml
          if-no-files-found: error
