name: Markdown
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: markdown-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  markdown:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
